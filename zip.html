<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сборка ZIP — Yandex Disk Downloader</title><link rel="stylesheet" href="ui.css"><style>body{display:grid;place-items:center;min-height:100vh}.zip-card{width:min(600px,95vw);background:var(--surface);border:1px solid var(--edge);border-radius:24px;padding:30px;box-shadow:0 12px 60px #0002}h1{font-size:24px;margin:15px 0}p{color:var(--muted)}#progress{height:12px;background:var(--tint);border-radius:12px;overflow:hidden}#fill{height:100%;width:0;background:var(--accent)}#line{margin:15px 0;overflow-wrap:anywhere}.warning{color:var(--muted);font-size:12px}</style></head><body><div class="zip-card"><div class="logo">⇩</div><h1>Собираем ZIP</h1><p>Архив из нескольких выделенных файлов создаётся локально. Не закрывай эту вкладку, пока не появится сообщение о завершении.</p><div id="line">Подготовка…</div><div id="progress"><div id="fill"></div></div><p id="percent">0%</p><p class="warning">Для больших видео лучше скачивать отдельные файлы: ZIP собирается в оперативной памяти браузера.</p><button id="manager" class="main">Открыть менеджер загрузок</button></div><script src="vendor/jszip.min.js"></script><script src="zip.js"></script></body></html>
