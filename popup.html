<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disk Downloader by sakura</title><link rel="stylesheet" href="ui.css"></head><body data-view="popup"><div class="app">
<header><div class="brand"><div class="logo">⇩</div><div><h1>Disk Downloader <small>by sakura</small></h1><p>Очередь загрузок</p></div></div><button class="icon" id="openDash" title="Большой менеджер">⤢</button></header>
<div class="stats"><div><span>Очередь</span><strong id="countQueue">0</strong></div><div><span>Загрузка</span><strong id="countActive">0</strong></div><div><span>Готово</span><strong id="countComplete">0</strong></div><div><span>Ошибки</span><strong id="countFailed">0</strong></div><div><span>Не скачано</span><strong id="countCanceled">0</strong></div></div>
<div class="sectionhead"><b>Текущие загрузки</b><button class="link" id="refresh">Обновить ↻</button></div><div id="jobs" class="jobs"></div>
<div class="toolbar"><button id="stopAll" class="danger">■ Остановить все</button><button id="clearCompleted" class="secondary">Очистить готовые</button><button id="clearFailed" class="secondary">Очистить ошибки</button></div>
<section id="quickSettings" class="quick hide"><strong>Быстрые настройки · автосохранение</strong><div class="setting"><div class="choices"><label><input type="radio" name="quickMode" value="files"> Файлы</label><label><input type="radio" name="quickMode" value="zip"> ZIP</label></div></div><label class="inline">Параллельных загрузок <input id="qConcurrent" type="number" min="1" max="10" value="3" class="number"></label><p id="qWarning" class="warning hide">Больше 5 загрузок: возможны ошибки.</p><label class="checkline"><input id="qRecursive" type="checkbox"> Вложенные папки</label><button class="link" id="qAllSettings">Все настройки ↗</button></section>
<footer><button class="main" id="openManager">Менеджер</button><button id="openSettings" class="secondary">⚙ Настройки</button></footer>
<div id="toast" role="status"></div></div><script src="ui.js"></script></body></html>
